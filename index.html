<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6ff">
  <title>Orbit Quiz — Space Exploration</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f6ff;
      --surface: #fff;
      --surface-soft: #f7f7fc;
      --ink: #20213b;
      --muted: #777991;
      --line: #e7e7f0;
      --purple: #7656e8;
      --purple-dark: #6040d3;
      --purple-pale: #f0ecff;
      --green: #16835c;
      --green-pale: #e5f8ef;
      --red: #c84755;
      --red-pale: #fff0f0;
      --shadow: 0 22px 70px rgb(52 47 103 / 10%);
      --star-color: 91 83 153;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 20px;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 12% 14%, rgb(212 202 255 / 40%), transparent 32%),
        radial-gradient(ellipse at 88% 88%, rgb(255 218 226 / 35%), transparent 28%),
        var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.55;
    }

    body::before {
      content: "";
      position: fixed;
      z-index: 0;
      inset: -50%;
      pointer-events: none;
      opacity: .42;
      background-image:
        radial-gradient(1px 1px at 24px 38px, rgb(var(--star-color) / .72) 50%, transparent 100%),
        radial-gradient(1.5px 1.5px at 112px 94px, rgb(var(--star-color) / .48) 50%, transparent 100%),
        radial-gradient(1px 1px at 70px 152px, rgb(var(--star-color) / .62) 50%, transparent 100%);
      background-size: 190px 190px, 270px 270px, 330px 330px;
      animation: star-drift 35s linear infinite;
    }

    .quiz-shell {
      z-index: 1;
    }

    button { font: inherit; }

    .quiz-shell {
      width: min(100%, 560px);
      position: relative;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 66px;
      padding: 11px 15px;
      margin-bottom: 16px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: var(--surface);
      box-shadow: 0 8px 24px rgb(52 47 103 / 7%);
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: linear-gradient(145deg, var(--purple-pale), var(--surface-soft));
      color: var(--purple);
    }

    .brand-mark svg { width: 27px; height: 27px; }

    .brand-identity {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-copy { display: grid; gap: 1px; }

    .brand-title {
      color: var(--ink);
      font-size: 13px;
      font-weight: 850;
      letter-spacing: .13em;
      line-height: 1.25;
      text-transform: uppercase;
    }

    .brand-subtitle {
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .025em;
    }

    .brand-status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface-soft);
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .09em;
      white-space: nowrap;
    }

    .status-light {
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #22a875;
      box-shadow: 0 0 0 3px rgb(34 168 117 / 13%), 0 0 10px rgb(34 168 117 / 45%);
      animation: status-pulse 2.5s ease-in-out infinite;
    }

    .card {
      padding: 36px;
      border: 1px solid rgb(255 255 255 / 75%);
      border-radius: 26px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .screen { animation: arrive .35s ease both; }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--purple);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    h1, h2, p { margin-top: 0; }

    h1, h2 {
      margin-bottom: 12px;
      font-size: clamp(27px, 7vw, 36px);
      line-height: 1.12;
      letter-spacing: -.04em;
    }

    .intro-art {
      display: grid;
      place-items: center;
      min-height: 160px;
      margin: 25px 0 24px;
      overflow: hidden;
      position: relative;
      border-radius: 19px;
      background: linear-gradient(135deg, #eeeaff, #fceaf1 58%, #fff4dc);
      font-size: 72px;
    }

    .intro-art::before, .intro-art::after {
      content: "✦";
      position: absolute;
      color: #947df0;
      font-size: 19px;
      animation: twinkle 2.2s ease-in-out infinite alternate;
    }

    .intro-art::before { top: 24px; left: 22%; }
    .intro-art::after { right: 19%; bottom: 22px; animation-delay: .8s; }

    .intro-copy, .result-copy { color: var(--muted); }

    .meta-row {
      display: flex;
      gap: 10px;
      margin: 22px 0 25px;
    }

    .meta-pill {
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .primary-button {
      width: 100%;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 0;
      border-radius: 14px;
      background: var(--purple);
      color: #fff;
      cursor: pointer;
      font-weight: 750;
      transition: background .18s ease, transform .18s ease, box-shadow .18s ease;
    }

    .primary-button:hover {
      transform: translateY(-2px);
      background: var(--purple-dark);
      box-shadow: 0 9px 22px rgb(118 86 232 / 25%);
    }

    .primary-button:focus-visible, .answer:focus-visible, .text-button:focus-visible {
      outline: 3px solid #b5a5ff;
      outline-offset: 3px;
    }

    .quiz-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 26px;
    }

    .question-count {
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }

    .question-count strong { color: var(--ink); }

    .score-chip {
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface-soft);
      font-size: 12px;
      font-weight: 750;
      white-space: nowrap;
    }

    .progress-track {
      height: 8px;
      margin-top: 12px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--line);
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #8c6eff, #bd79e8);
      transition: width .45s cubic-bezier(.2, .8, .2, 1);
    }

    .question-title {
      margin: 0 0 22px;
      font-size: clamp(22px, 5vw, 27px);
      line-height: 1.28;
      letter-spacing: -.035em;
    }

    .answers {
      display: grid;
      gap: 11px;
    }

    .answer {
      width: 100%;
      min-height: 54px;
      padding: 12px 15px;
      display: flex;
      align-items: center;
      gap: 13px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      text-align: left;
      transition: border-color .18s ease, background .18s ease, transform .18s ease;
    }

    .answer:not(:disabled):hover {
      transform: translateY(-1px);
      border-color: #b9a9fb;
      background: var(--purple-pale);
    }

    .answer:disabled { cursor: default; }

    .answer-letter {
      width: 28px;
      height: 28px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: var(--surface-soft);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .answer.is-correct {
      border-color: #88d2ad;
      background: var(--green-pale);
      color: var(--green);
      animation: pop .35s ease;
    }

    .answer.is-correct .answer-letter {
      background: #c9f0dc;
      color: var(--green);
    }

    .answer.is-wrong {
      border-color: #f0a2a5;
      background: var(--red-pale);
      color: var(--red);
      animation: shake .38s ease;
    }

    .answer.is-wrong .answer-letter {
      background: #ffe0e1;
      color: var(--red);
    }

    .feedback {
      min-height: 48px;
      padding: 12px 14px;
      margin-top: 16px;
      border-radius: 12px;
      font-size: 13px;
      animation: arrive .25s ease both;
    }

    .feedback.correct { background: var(--green-pale); color: var(--green); }
    .feedback.wrong { background: var(--red-pale); color: var(--red); }
    .feedback strong { font-weight: 800; }

    .next-button { margin-top: 14px; }

    .result-emoji {
      width: 116px;
      height: 116px;
      display: grid;
      place-items: center;
      margin: 10px auto 23px;
      border-radius: 36px;
      background: linear-gradient(145deg, #eeeaff, #fff0e2);
      font-size: 60px;
      animation: float 3s ease-in-out infinite;
    }

    .celebration-stage {
      min-height: 150px;
      display: grid;
      place-items: center;
      position: relative;
      isolation: isolate;
      overflow: hidden;
      border-radius: 20px;
    }

    .celebration-stage .result-emoji {
      position: relative;
      z-index: 1;
      margin: 10px auto 23px;
    }

    .laser-beams {
      position: absolute;
      z-index: 0;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .laser-beam {
      width: 150%;
      height: 2px;
      position: absolute;
      top: 50%;
      left: 50%;
      opacity: 0;
      background: linear-gradient(90deg, transparent, var(--laser-color) 38%, #fff 50%, var(--laser-color) 62%, transparent);
      box-shadow: 0 0 8px var(--laser-color), 0 0 18px var(--laser-color);
      transform: translate(-50%, -50%) rotate(var(--laser-angle)) scaleX(.08);
      animation: laser-sweep var(--laser-duration) ease-in-out var(--laser-delay) infinite alternate;
    }

    .disco-ball {
      position: absolute;
      z-index: 2;
      top: 0;
      left: 50%;
      font-size: 31px;
      line-height: 1;
      filter: drop-shadow(0 0 9px rgb(255 255 255 / 85%));
      transform: translateX(-50%);
      animation: disco-swing 1.8s ease-in-out infinite alternate;
    }

    .result-screen { text-align: center; }
    .result-screen .eyebrow { margin-bottom: 9px; }
    .result-screen h2 { margin-bottom: 10px; }

    .final-score {
      margin: 22px 0;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--surface-soft);
      font-weight: 700;
    }

    .final-score strong {
      color: var(--purple);
      font-size: 26px;
      letter-spacing: -.04em;
    }

    .personal-best {
      margin-top: 6px;
      color: var(--muted);
      font-size: 14px;
    }

    .personal-best strong {
      font-size: inherit;
      letter-spacing: normal;
    }

    .text-button {
      display: inline-block;
      padding: 8px 12px;
      margin-top: 13px;
      border: 0;
      background: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      font-weight: 650;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .sr-only {
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
      position: absolute;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes shake {
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }
    @keyframes pop {
      50% { transform: scale(1.025); }
    }
    @keyframes twinkle {
      from { opacity: .45; transform: scale(.8) rotate(0deg); }
      to { opacity: 1; transform: scale(1.2) rotate(28deg); }
    }
    @keyframes float {
      50% { transform: translateY(-7px) rotate(3deg); }
    }
    @keyframes status-pulse {
      50% { box-shadow: 0 0 0 5px rgb(34 168 117 / 8%), 0 0 12px rgb(34 168 117 / 35%); }
    }
    @keyframes star-drift {
      to { transform: translate3d(17%, 17%, 0); }
    }
    @keyframes laser-sweep {
      0% {
        opacity: .3;
        transform: translate(-50%, -50%) rotate(var(--laser-angle)) scaleX(.08);
      }
      100% {
        opacity: .95;
        transform: translate(-50%, -50%) rotate(var(--laser-angle)) scaleX(1);
      }
    }
    @keyframes disco-swing {
      from { transform: translateX(-50%) rotate(-12deg); }
      to { transform: translateX(-50%) rotate(12deg); }
    }

    @media (max-width: 520px) {
      body { padding: 22px 14px; }
      .card { padding: 25px 21px; border-radius: 21px; }
      .intro-art { min-height: 135px; font-size: 62px; }
      .brand { padding: 10px 11px; }
      .brand-status { padding: 7px 8px; font-size: 9px; }
      .brand-subtitle { font-size: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      body::before { animation: none; }
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
      .laser-beam {
        opacity: .75;
        transform: translate(-50%, -50%) rotate(var(--laser-angle)) scaleX(1);
      }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11111b;
        --surface: #1c1c2a;
        --surface-soft: #262637;
        --ink: #f2f0ff;
        --muted: #aaa9c0;
        --line: #36364a;
        --purple: #a18aff;
        --purple-dark: #8a6ff0;
        --purple-pale: #30294a;
        --green: #7de0ae;
        --green-pale: #193b31;
        --red: #ff9299;
        --red-pale: #44252d;
        --shadow: 0 22px 70px rgb(0 0 0 / 28%);
        --star-color: 204 197 255;
      }
      body {
        background:
          radial-gradient(ellipse at 12% 14%, rgb(88 69 147 / 23%), transparent 32%),
          radial-gradient(ellipse at 88% 88%, rgb(124 60 100 / 16%), transparent 28%),
          var(--bg);
      }
      .card { border-color: rgb(255 255 255 / 5%); }
      .intro-art, .result-emoji { background: linear-gradient(135deg, #302849, #412c41 58%, #443723); }
      .answer.is-correct .answer-letter { background: #24523e; }
      .answer.is-wrong .answer-letter { background: #5c3038; }
    }
  </style>
</head>
<body>
  <main class="quiz-shell">
    <header class="brand" aria-label="Orbit Quiz mission control">
      <div class="brand-identity">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="16" cy="16" r="5" fill="currentColor"/>
            <ellipse cx="16" cy="16" rx="13" ry="6.5" stroke="currentColor" stroke-width="1.5" transform="rotate(-32 16 16)"/>
            <circle cx="26.2" cy="9.5" r="2" fill="currentColor"/>
          </svg>
        </span>
        <span class="brand-copy">
          <span class="brand-title">Orbit Quiz</span>
          <span class="brand-subtitle">Space exploration · Flight 01</span>
        </span>
      </div>
      <div class="brand-status" aria-label="Mission status: ready">
        <span class="status-light" aria-hidden="true"></span>
        <span>READY</span>
      </div>
    </header>
    <section class="card" id="app" aria-live="polite"></section>
  </main>

  <script>
    const questions = [
      {
        question: "Which planet is known as the Red Planet?",
        answers: ["Venus", "Mars", "Jupiter", "Mercury"],
        correct: 1,
        fact: "Mars looks red because iron-rich dust on its surface has rusted."
      },
      {
        question: "What was the first human-made object to reach space?",
        answers: ["Sputnik 1", "V-2 rocket", "Explorer 1", "Apollo 11"],
        correct: 1,
        fact: "A German V-2 rocket crossed the 100 km Kármán line in 1944."
      },
      {
        question: "Which planet has the most moons confirmed so far?",
        answers: ["Jupiter", "Neptune", "Saturn", "Uranus"],
        correct: 2,
        fact: "Saturn currently leads the count, with more than 140 confirmed moons."
      },
      {
        question: "What is the name of the galaxy that contains our Solar System?",
        answers: ["Andromeda", "Whirlpool", "Sombrero", "Milky Way"],
        correct: 3,
        fact: "Our Solar System sits in the Milky Way's Orion Arm."
      },
      {
        question: "Who was the first person to walk on the Moon?",
        answers: ["Buzz Aldrin", "Yuri Gagarin", "Neil Armstrong", "Michael Collins"],
        correct: 2,
        fact: "Neil Armstrong stepped onto the lunar surface on July 20, 1969."
      },
      {
        question: "What is the largest planet in our Solar System?",
        answers: ["Saturn", "Jupiter", "Neptune", "Earth"],
        correct: 1,
        fact: "Jupiter is so large that more than 1,300 Earths could fit inside it."
      },
      {
        question: "Which space telescope launched in 2021 to study the early universe?",
        answers: ["Hubble", "Kepler", "Chandra", "James Webb"],
        correct: 3,
        fact: "The James Webb Space Telescope observes the universe in infrared light."
      },
      {
        question: "What force keeps planets in orbit around the Sun?",
        answers: ["Magnetism", "Friction", "Gravity", "Solar wind"],
        correct: 2,
        fact: "The Sun's gravity bends a planet's motion into a stable orbit."
      },
      {
        question: "Which was the first artificial satellite to orbit Earth?",
        answers: ["Sputnik 1", "Vostok 1", "Voyager 1", "Luna 2"],
        correct: 0,
        fact: "The Soviet Union launched Sputnik 1 on October 4, 1957."
      },
      {
        question: "About how long does sunlight take to reach Earth?",
        answers: ["8 seconds", "8 minutes", "1 hour", "1 day"],
        correct: 1,
        fact: "Sunlight travels about 150 million km to Earth in roughly 8 minutes and 20 seconds."
      }
    ];

    const app = document.querySelector("#app");
    const personalBestKey = "orbitQuizPersonalBest";
    let currentQuestion = 0;
    let score = 0;
    let answered = false;
    let quizQuestions = [];

    function shuffleQuestions(items) {
      const shuffled = [...items];
      for (let index = shuffled.length - 1; index > 0; index -= 1) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [shuffled[index], shuffled[swapIndex]] = [shuffled[swapIndex], shuffled[index]];
      }
      return shuffled;
    }

    function readPersonalBest() {
      try {
        const storedScore = window.localStorage.getItem(personalBestKey);
        if (storedScore === null) return { available: true, score: null };
        if (storedScore.trim() === "") return { available: true, score: null };
        const best = Number(storedScore);
        const score = Number.isInteger(best) && best >= 0 && best <= questions.length ? best : null;
        return { available: true, score };
      } catch {
        return { available: false, score: null };
      }
    }

    function updatePersonalBest(currentScore) {
      const storedBest = readPersonalBest();
      if (!storedBest.available) return currentScore;
      if (storedBest.score !== null && storedBest.score >= currentScore) return storedBest.score;
      try {
        window.localStorage.setItem(personalBestKey, String(currentScore));
      } catch {
        // Keep quiz results available even when browser storage is blocked.
      }
      return currentScore;
    }

    function renderWelcome() {
      app.innerHTML = `
        <div class="screen">
          <p class="eyebrow">Your next adventure</p>
          <h1>Ready for liftoff?</h1>
          <div class="intro-art" aria-hidden="true">🚀</div>
          <p class="intro-copy">Explore planets, missions, and the mysteries beyond. How much do you know about space?</p>
          <div class="meta-row" aria-label="Quiz details">
            <span class="meta-pill">✦ ${questions.length} questions</span>
            <span class="meta-pill">◷ About 3 minutes</span>
          </div>
          <button class="primary-button" type="button" id="start-button">Start exploring <span aria-hidden="true">→</span></button>
        </div>`;
      document.querySelector("#start-button").addEventListener("click", () => {
        currentQuestion = 0;
        score = 0;
        quizQuestions = shuffleQuestions(questions);
        renderQuestion();
      });
    }

    function renderQuestion() {
      answered = false;
      const item = quizQuestions[currentQuestion];
      const progress = (currentQuestion / quizQuestions.length) * 100;
      const letters = ["A", "B", "C", "D"];
      app.innerHTML = `
        <div class="screen">
          <div class="quiz-top">
            <div class="question-count"><strong>Question ${currentQuestion + 1}</strong> of ${quizQuestions.length}
              <div class="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="${quizQuestions.length}" aria-valuenow="${currentQuestion}">
                <div class="progress-fill" style="width:${progress}%"></div>
              </div>
            </div>
            <div class="score-chip" aria-label="Score ${score}">⭐ <span id="score-value">${score}</span> pts</div>
          </div>
          <p class="eyebrow">Space exploration</p>
          <h2 class="question-title">${item.question}</h2>
          <div class="answers" role="group" aria-label="Answer choices">
            ${item.answers.map((answer, index) => `
              <button class="answer" type="button" data-answer="${index}">
                <span class="answer-letter" aria-hidden="true">${letters[index]}</span>
                <span>${answer}</span>
              </button>`).join("")}
          </div>
          <div id="feedback-slot" aria-live="assertive"></div>
        </div>`;
      app.querySelectorAll(".answer").forEach(button => {
        button.addEventListener("click", () => chooseAnswer(Number(button.dataset.answer)));
      });
    }

    function chooseAnswer(selection) {
      if (answered) return;
      answered = true;
      const item = quizQuestions[currentQuestion];
      const isCorrect = selection === item.correct;
      const buttons = app.querySelectorAll(".answer");
      buttons.forEach((button, index) => {
        button.disabled = true;
        if (index === item.correct) button.classList.add("is-correct");
        if (index === selection && !isCorrect) button.classList.add("is-wrong");
      });
      if (isCorrect) {
        score += 1;
        document.querySelector("#score-value").textContent = score;
        document.querySelector(".score-chip").setAttribute("aria-label", `Score ${score}`);
      }
      const feedback = document.querySelector("#feedback-slot");
      feedback.innerHTML = `
        <div class="feedback ${isCorrect ? "correct" : "wrong"}">
          <strong>${isCorrect ? "That's right! " : "Not quite. "}</strong>${item.fact}
        </div>
        <button class="primary-button next-button" type="button" id="next-button">
          ${currentQuestion === quizQuestions.length - 1 ? "See my results" : "Next question"}
          <span aria-hidden="true">→</span>
        </button>`;
      document.querySelector("#next-button").addEventListener("click", () => {
        currentQuestion += 1;
        if (currentQuestion === quizQuestions.length) renderResults();
        else renderQuestion();
      });
      document.querySelector("#next-button").focus();
    }

    function renderResults() {
      const personalBest = updatePersonalBest(score);
      const ratio = score / quizQuestions.length;
      const result = ratio === 1
        ? { emoji: "🏆", title: "Out of this world!", copy: "A perfect mission. Your space knowledge is stellar." }
        : ratio >= .7
          ? { emoji: "🌟", title: "Stellar work!", copy: "You know your way around the cosmos. Keep reaching for the stars." }
          : ratio >= .4
            ? { emoji: "🪐", title: "Nice orbit!", copy: "A solid trip through space. There's always more to discover." }
            : { emoji: "🌱", title: "Future astronaut!", copy: "Every explorer starts somewhere. Ready for another launch?" };
      const laserShow = score >= 8;
      const laserBeams = laserShow
        ? `<div class="laser-beams" aria-hidden="true">${Array.from({ length: 14 }, () => {
            const angle = Math.floor(Math.random() * 360);
            const hue = Math.floor(Math.random() * 360);
            const duration = (1.1 + Math.random() * 1.8).toFixed(2);
            const delay = (Math.random() * -2.5).toFixed(2);
            return `<span class="laser-beam" style="--laser-angle:${angle}deg;--laser-color:hsl(${hue} 100% 58%);--laser-duration:${duration}s;--laser-delay:${delay}s"></span>`;
          }).join("")}</div>`
        : "";
      app.innerHTML = `
        <div class="screen result-screen">
          <p class="eyebrow">Mission complete</p>
          <div class="celebration-stage">
            ${laserBeams}
            ${score === quizQuestions.length ? '<span class="disco-ball" aria-hidden="true">🪩</span>' : ""}
            <div class="result-emoji" role="img" aria-label="${result.emoji}">${result.emoji}</div>
          </div>
          <h2>${result.title}</h2>
          <p class="result-copy">${result.copy}</p>
          <div class="final-score">
            <div>You scored <strong>${score} / ${quizQuestions.length}</strong></div>
            <div class="personal-best">Personal best <strong>${personalBest} / ${quizQuestions.length}</strong></div>
          </div>
          <button class="primary-button" type="button" id="restart-button">Explore again <span aria-hidden="true">↻</span></button>
        </div>`;
      document.querySelector("#restart-button").addEventListener("click", () => {
        currentQuestion = 0;
        score = 0;
        renderWelcome();
      });
    }

    renderWelcome();
  </script>
</body>
</html>
